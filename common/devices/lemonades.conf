# OnePlus 9R, not OnePlus 9 (lemonade) or 9 Pro (lemonadep).
# Offline bring-up: UEFI probe only. No boot.img or XNU boot is validated yet.
NAME="OnePlus 9R (lemonades)"
KIND=phone
SOC="Qualcomm Snapdragon 870 (SM8250-AC)"
BRINGUP_STAGE=probe
UEFI_TARGET=lemonades
UEFI_FD=
DTB=
# Matches LE2101_14.0.0.2301 stock XBL ELF segment and uefiplat.cfg.
# Still requires matching-device boot validation; see uefi/lemonades/stock-memory.json.
FD_BASE=0x9FC00000
FD_SIZE=0x300000
# No fixed XNUP payload reservation is used by the probe.
PAYLOAD_BASE=
FB_BASE=
WIFI_ATH11K=0
BOOTARGS="-v cpus=1"
DEFAULT_SECS=15
USERLAND_VARS=""
FIRMWARE=""
